  <!-- P17-CACHE — démo sandbox — à retirer en production.
       Désenregistrement défensif des anciens service workers + purge des
       caches navigateur, pour éviter qu'un visiteur déjà passé sur une
       build antérieure (avec service worker actif) reste bloqué sur une
       version périmée de l'app.
       Volontairement SANS location.reload() : aucun rechargement
       automatique n'est déclenché ici, donc aucun risque de boucle de
       rechargement -- pas besoin de garde-fou sessionStorage.
       STRATÉGIE RETENUE (option a) : `flutter build web --release
       --pwa-strategy=none` NE supprime PAS flutter_service_worker.js.
       Il génère un fichier présent mais à corps vide (0 octet) --
       200 avec Content-Length 0, jamais 404. Correction d'une
       affirmation antérieure erronée : le mécanisme « script 404 →
       désinscription automatique par le navigateur » NE s'applique PAS
       ici, puisqu'aucun 404 n'est produit. Ce qui se passe réellement :
       l'ancien service worker cacheur est remplacé par un service
       worker no-op (corps vide) à la prochaine visite/mise à jour.
       LIMITE CONNUE (à documenter, ne pas la présenter comme une
       solution complète) : un service worker à corps vide reste une
       registration valide, et sans skipWaiting (qu'un corps vide ne
       contient par définition pas), la nouvelle version reste en
       attente tant qu'un client contrôlé par l'ancien SW est ouvert.
       Sur mobile, un onglet jamais réellement fermé peut donc maintenir
       l'ancien SW actif longtemps. Ce bloc ne peut rien faire sur un
       appareil déjà pollué, car c'est précisément CET ancien service
       worker -- pas ce nouveau index.html -- qui répond aux requêtes de
       navigation depuis son propre cache. La seule parade fiable sur un
       appareil déjà pollué reste la navigation privée, ou « cadenas →
       Paramètres du site → Effacer et réinitialiser » ; le reste
       (ce bloc + le SW no-op) est du durcissement pour les visiteurs
       futurs, pas une garantie immédiate. Un simple paramètre ?v=...
       n'a aucun effet : le service worker Flutter le retire de la clé
       avant de consulter son cache, et même sans SW il ne rafraîchit
       pas main.dart.js qui a sa propre URL versionnée -- ne jamais le
       donner comme remède côté client. -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) {
          registration.unregister();
        });
      }).catch(function () {});
    }
    if (window.caches && window.caches.keys) {
      window.caches.keys().then(function (keys) {
        keys.forEach(function (key) {
          window.caches.delete(key);
        });
      }).catch(function () {});
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
